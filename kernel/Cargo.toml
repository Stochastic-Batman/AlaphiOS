[package]
name = "kernel"
version = "0.1.0"
edition = "2024"
authors = ["Stochastic-Batman"]
license = "GPL-3.0-only"
repository = "https://github.com/Stochastic-Batman/AlaphiOS"

[[bin]]
name = "kernel"
path = "src/main.rs"

[dependencies]
bootloader_api = "0.11"          # no_std entry-point contract + BootInfo
x86_64        = "0.15"           # GDT/IDT structures, paging, port I/O, TLB
pic8259       = "0.10"           # 8259A PIC - IRQ remapping and EOI
uart_16550    = "0.3"            # serial debug output (port 0x3F8)
spin          = "0.9"            # Mutex, Lazy - no OS primitives needed
volatile      = "0.5"            # memory-mapped I/O register access
fatfs = { git = "https://github.com/rafalh/rust-fatfs", default-features = false, features = ["alloc"] }
sha2  = { version = "0.10", default-features = false, features = ["force-soft"] }
